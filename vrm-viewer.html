<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VRM Viewer — PosePuppet</title>
    <meta name="description" content="Browse and inspect VRM and GLB 3D models from the PosePuppet project" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/vrm-viewer.css" />
  </head>
  <body>
    <header id="status-bar">
      <div class="status-left">
        <a href="/" class="brand-link">PosePuppet</a>
        <span class="separator">›</span>
        <span class="page-title">VRM Viewer</span>
      </div>
      <div id="status-center" class="status-center">
        <span id="status-text">Loading manifest…</span>
        <div id="progress-bar" class="progress-bar hidden">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>
      <div class="status-right">
        <span id="model-info" class="model-info"></span>
      </div>
    </header>

    <div id="app">
      <aside id="sidebar">
        <div class="sidebar-header">
          <h2>Models</h2>
          <span id="model-count" class="badge">0</span>
        </div>

        <div class="filter-bar">
          <button id="filter-all" class="filter-btn active">All <span id="filter-count-all" class="filter-count">0</span></button>
          <button id="filter-vrm" class="filter-btn">VRM <span id="filter-count-vrm" class="filter-count">0</span></button>
          <button id="filter-glb" class="filter-btn">GLB <span id="filter-count-glb" class="filter-count">0</span></button>
        </div>

        <div class="sidebar-search">
          <input type="text" id="search-input" placeholder="Search models…" autocomplete="off" />
        </div>

        <div id="model-list" class="model-list"></div>

        <div class="sidebar-footer">
          <div id="drop-zone" class="drop-zone">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <span>Drop .vrm / .glb / .gltf</span>
          </div>
        </div>
      </aside>

      <main id="viewport">
        <canvas id="canvas"></canvas>

        <div id="toolbar">
          <button id="btn-animate" class="tool-btn" title="Toggle Rigging Animation">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="5" r="2"/><line x1="12" y1="7" x2="12" y2="15"/>
              <line x1="8" y1="10" x2="16" y2="10"/>
              <line x1="12" y1="15" x2="9" y2="21"/><line x1="12" y1="15" x2="15" y2="21"/>
            </svg>
          </button>
          <div class="toolbar-sep"></div>
          <button id="btn-grid" class="tool-btn active" title="Toggle Grid">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18"/>
              <line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/>
              <line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/>
            </svg>
          </button>
          <button id="btn-axes" class="tool-btn" title="Toggle Axes">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="2" x2="12" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/>
              <polyline points="8 6 12 2 16 6"/><polyline points="18 8 22 12 18 16"/>
            </svg>
          </button>
          <button id="btn-wireframe" class="tool-btn" title="Toggle Wireframe">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/>
              <line x1="12" y1="22" x2="12" y2="8.5"/><line x1="22" y1="8.5" x2="2" y2="8.5"/>
            </svg>
          </button>
          <div class="toolbar-sep"></div>
          <button id="btn-reset" class="tool-btn" title="Reset Camera">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
            </svg>
          </button>
          <button id="btn-screenshot" class="tool-btn" title="Screenshot">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
          </button>
        </div>

        <div id="meta-panel" class="meta-panel hidden">
          <h3>Model Info</h3>
          <div id="meta-content"></div>
        </div>
      </main>
    </div>

    <script type="module" src="/src/vrm-viewer.ts"></script>
  </body>
</html>
